<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title><?= titulo ?> · <?= ferramenta ?></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <?!= incluir('Estilos') ?>
</head>
<body>
  <div class="app">
    <!-- barra lateral: o seletor principal vira um menu -->
    <aside class="lateral">
      <!-- marca: ícone e nome da ferramenta em que o painel foi feito -->
      <div class="marca">
        <?!= incluir('Icone') ?>
        <div><span id="nome-painel"><?= titulo ?></span><small>Painel em <b><?= ferramenta ?></b></small></div>
      </div>
      <nav id="menu" aria-label="Métricas"></nav>
    </aside>

    <main class="principal">
      <!-- topo: caminho, seletor (telas estreitas), período e tema -->
      <header class="topo">
        <div class="caminho" id="caminho"></div>
        <!-- em telas estreitas a barra lateral some: a marca da ferramenta vem para o topo -->
        <div class="marca-compacta"><?!= incluir('Icone') ?><span>Painel em <b><?= ferramenta ?></b></span></div>
        <select id="seletor-compacto" aria-label="Métrica"></select>
        <div class="topo-direita">
          <!-- filtro temporal: mesmos meses nos dois anos -->
          <div class="filtro-tempo" aria-label="Período">
            <label>De <select id="mes-ini"></select></label>
            <label>até <select id="mes-fim"></select></label>
          </div>
          <span class="chip" id="chip-periodo">…</span>
          <button class="botao-icone" id="tema" title="Tema claro/escuro" aria-label="Alternar tema">◐</button>
        </div>
      </header>

      <section class="conteudo">
        <h1 class="titulo-pagina" id="titulo-pagina"><?= titulo ?></h1>

        <!-- P1: KPIs fixos -->
        <div class="kpis" id="kpis">
          <div class="kpi esqueleto"></div><div class="kpi esqueleto"></div>
          <div class="kpi esqueleto"></div><div class="kpi esqueleto"></div>
        </div>

        <div class="grade">
          <!-- P2: mapa + ranking -->
          <article class="cartao area-mapa" id="cartao-mapa">
            <header><h2 id="t-mapa"></h2><p class="sub" id="s-mapa"></p></header>
            <div class="mapa-corpo">
              <div class="mapa-col">
                <div class="grafico" id="g-mapa" style="height:300px"></div>
                <div class="legenda" id="legenda-mapa"></div>
              </div>
              <ol class="ranking" id="ranking"></ol>
            </div>
          </article>

          <!-- P3: pareado (dumbbell) -->
          <article class="cartao area-pareado" id="cartao-pareado">
            <header><h2 id="t-pareado"></h2><p class="sub" id="s-pareado"></p></header>
            <div class="grafico" id="g-pareado"></div>
          </article>

          <!-- P4: tendência -->
          <article class="cartao area-tendencia">
            <header class="cab-tendencia">
              <h2 id="t-tendencia"></h2>
              <div class="legenda-serie" id="legenda-serie"></div>
            </header>
            <p class="sub" id="s-tendencia"></p>
            <div class="grafico" id="g-tendencia" style="height:260px"></div>
          </article>
        </div>

        <footer class="rodape-notas" id="notas-rodape"></footer>
      </section>
    </main>

    <!-- painel direito: sobre os dados -->
    <aside class="direita">
      <h3>Sobre os dados</h3>
      <ul class="notas" id="notas"></ul>
    </aside>
  </div>

  <div class="erro" id="erro" hidden>
    <p id="erro-texto"></p>
    <button id="erro-tentar">Tentar de novo</button>
  </div>

  <script>window.GEOJSON = <?!= geojsonInline ?>;</script>
  <?!= incluir('App') ?>
</body>
</html>
