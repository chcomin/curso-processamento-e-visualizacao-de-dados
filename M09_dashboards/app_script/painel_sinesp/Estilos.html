<style>
/* Tokens do ui-spec (SnowUI). Use só as variáveis. */
:root {
  --bg: #FFFFFF; --surface: #F7F9FB; --surface-blue: #E3F5FF; --surface-lav: #E5ECF6;
  --hover: rgba(28,28,28,.05); --selected: rgba(28,28,28,.05); --divider: rgba(28,28,28,.10);
  --ink: #1C1C1C; --ink-80: rgba(28,28,28,.80); --ink-40: rgba(28,28,28,.40);
  --ink-20: rgba(28,28,28,.20); --ink-10: rgba(28,28,28,.10);
  --data-1: #1C1C1C; --data-2: #A8C5DA; --data-3: #95A4FC; --data-4: #BAEDBD;
  --seq-0: #E3F5FF; --seq-1: #B1E3FF; --seq-2: #7FB8DA; --seq-3: #4A7FA8; --seq-4: #1C3D5A;
  --good: #0F7B5F; --bad: #C0362C; --neutral: rgba(28,28,28,.80);
  --kpi-ink: #1C1C1C;
  --radius-card: 16px; --radius-control: 8px; --gap: 28px; --pad-card: 24px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg: #1C1C1C; --surface: rgba(255,255,255,.05);
  --hover: rgba(255,255,255,.08); --selected: rgba(255,255,255,.10); --divider: rgba(255,255,255,.10);
  --ink: #FFFFFF; --ink-80: rgba(255,255,255,.80); --ink-40: rgba(255,255,255,.40);
  --ink-20: rgba(255,255,255,.20); --ink-10: rgba(255,255,255,.10);
  --data-1: #C6C7F8; --good: #4FD1A5; --bad: #FF7A6E; --neutral: rgba(255,255,255,.80);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
h1, h2, h3, p { margin: 0; }
button, select { font: inherit; color: inherit; }

/* ------------------------------------------------------------ layout --- */
.app { display: grid; grid-template-columns: 212px minmax(0, 1fr) 280px; min-height: 100vh; }
.lateral { border-right: 1px solid var(--divider); padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.direita { border-left: 1px solid var(--divider); padding: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.principal { min-width: 0; }
.topo { height: 68px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--divider); }
.topo-direita { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.conteudo { padding: 28px; }

/* ------------------------------------------------- barra lateral (menu) --- */
.marca { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 24px; }
.marca .icone-ferramenta { flex: 0 0 24px; margin-top: 2px; }
.marca #nome-painel { display: block; font-weight: 600; line-height: 1.3; }
.marca small { display: block; font-size: 12px; color: var(--ink-40); margin-top: 2px; }
.marca small b { font-weight: 600; color: var(--ink-80); }
.grupo-menu { margin-bottom: 16px; }
.grupo-menu > span { display: block; color: var(--ink-40); padding: 4px 8px; }
.item-menu {
  position: relative; display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 4px 8px 4px 16px; min-height: 28px; border-radius: var(--radius-control); cursor: pointer; line-height: 1.35;
}
.item-menu:hover { background: var(--hover); }
.item-menu[aria-current="true"] { background: var(--selected); }
.item-menu[aria-current="true"]::before {
  content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 16px; margin-top: -8px;
  border-radius: 2px; background: var(--ink);
}

/* ----------------------------------------------------------------- topo --- */
.caminho { display: flex; gap: 8px; }
.caminho span:not(:last-child) { color: var(--ink-40); }
.caminho span:not(:last-child)::after { content: "/"; margin-left: 8px; }
.chip { background: var(--hover); border-radius: 999px; padding: 4px 12px; font-size: 12px; white-space: nowrap; }
.botao-icone { border: 0; background: transparent; width: 28px; height: 28px; border-radius: var(--radius-control); cursor: pointer; }
.botao-icone:hover { background: var(--hover); }
.marca-compacta { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-40); white-space: nowrap; }
.marca-compacta b { color: var(--ink-80); font-weight: 600; }
.filtro-tempo { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-40); }
.filtro-tempo select { border: 0; background: var(--hover); border-radius: var(--radius-control); padding: 4px 8px; font-size: 12px; color: var(--ink); cursor: pointer; }
#seletor-compacto { display: none; border: 0; background: var(--hover); border-radius: var(--radius-control); padding: 6px 10px; max-width: 60vw; }

/* ------------------------------------------------------------- conteúdo --- */
.titulo-pagina { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.kpi { border-radius: var(--radius-card); padding: var(--pad-card); min-height: 112px; color: var(--kpi-ink); }
.kpi:nth-child(odd) { background: var(--surface-blue); }
.kpi:nth-child(even) { background: var(--surface-lav); }
.kpi-rotulo { font-size: 14px; }
.kpi-linha { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 8px; }
.kpi-numero { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi-delta { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi-base { font-size: 12px; color: rgba(28,28,28,.55); margin-top: 6px; }
.delta-good { color: #0F7B5F; } .delta-bad { color: #C0362C; } .delta-neutral { color: rgba(28,28,28,.8); }

.grade {
  display: grid; gap: var(--gap);
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-areas: "mapa mapa mapa mapa mapa mapa mapa par par par par par"
                       "tend tend tend tend tend tend tend par par par par par";
}
.area-mapa { grid-area: mapa; } .area-pareado { grid-area: par; } .area-tendencia { grid-area: tend; }
.cartao { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad-card); min-width: 0; }
.cartao h2 { font-size: 14px; font-weight: 600; }
.sub { font-size: 12px; color: var(--ink-40); margin-top: 4px; margin-bottom: 16px; }
.cab-tendencia { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.legenda-serie { font-size: 12px; color: var(--ink-40); display: flex; gap: 16px; }
.legenda-serie b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.marcador { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.marcador.vazado { background: transparent !important; border: 2px solid var(--data-2); width: 9px; height: 9px; }

.mapa-corpo { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.legenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-40); margin-top: 8px; }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; }
.ranking { list-style: none; margin: 0; padding: 0; }
.ranking li { margin-bottom: 16px; }
.ranking .linha { display: flex; justify-content: space-between; font-size: 12px; font-variant-numeric: tabular-nums; }
.ranking .trilho { height: 2px; background: var(--ink-10); border-radius: 2px; margin-top: 6px; }
.ranking .barra { height: 2px; background: var(--data-2); border-radius: 2px; }

/* -------------------------------------------------------- painel direito --- */
.direita h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.notas { list-style: none; margin: 0; padding: 0; }
.notas li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; margin-bottom: 16px; }
.notas .icone { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-blue); color: #1C1C1C; display: grid; place-items: center; font-size: 12px; }
.notas b { font-weight: 400; display: block; }
.notas small { color: var(--ink-40); font-size: 12px; line-height: 1.4; display: block; margin-top: 2px; }
.rodape-notas { display: none; margin-top: var(--gap); }

/* ---------------------------------------------------------------- estados --- */
.esqueleto { background: var(--hover) !important; animation: pulsar 1.2s ease-in-out infinite; }
@keyframes pulsar { 50% { opacity: .5; } }
.vazio { color: var(--ink-40); text-align: center; padding: 48px 0; }
.erro { position: fixed; inset: auto 24px 24px auto; background: var(--surface); border-radius: var(--radius-card); padding: 16px 20px; max-width: 360px; box-shadow: 0 0 0 1px var(--divider); }
.erro button { margin-top: 8px; border: 0; background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: var(--radius-control); cursor: pointer; }

/* -------------------------------------------------------------- responsivo --- */
@media (max-width: 1439px) {
  .app { grid-template-columns: 212px minmax(0, 1fr); }
  .direita { display: none; }
  .rodape-notas { display: block; }
}
@media (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { display: none; }
  #seletor-compacto { display: block; }
  .marca-compacta { display: flex; }
  .caminho { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grade { grid-template-columns: minmax(0, 1fr); grid-template-areas: "mapa" "par" "tend"; }
}
@media (max-width: 767px) {
  .topo, .conteudo { padding-left: 16px; padding-right: 16px; }
  .topo { height: auto; flex-wrap: wrap; padding-top: 12px; padding-bottom: 12px; }
  .topo-direita { margin-left: 0; width: 100%; justify-content: space-between; }
  #seletor-compacto { max-width: 100%; width: 100%; }
  .kpis { gap: 12px; }
  .kpi { padding: 16px; }
  .kpi-linha { flex-direction: column; align-items: flex-start; gap: 2px; }
  .mapa-corpo { grid-template-columns: minmax(0, 1fr); }
  #g-mapa { height: 280px !important; }
}
</style>
